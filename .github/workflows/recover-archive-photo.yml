name: Recover approved archive photo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-archive-photo.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Find exact original by SHA-256 without importing unrelated files
        run: |
          python - <<'PY'
          import hashlib, io, os, pathlib, urllib.request, zipfile
          target = pathlib.Path('records/20261009-bak-cultivation/images/04_원본사진_박생육.jpg')
          expected = 'bdae24af7d1bfaa1686868cc6e27d7c0ccda70e258bb904997f2664245564c52'
          if target.exists() and hashlib.sha256(target.read_bytes()).hexdigest() == expected:
              print('Original photo already verified.'); raise SystemExit(0)
          examined = [0]
          def scan(data, depth=0):
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  for item in z.infolist():
                      if item.is_dir(): continue
                      if item.file_size == 497941:
                          content = z.read(item)
                          if hashlib.sha256(content).hexdigest() == expected:
                              target.parent.mkdir(parents=True, exist_ok=True)
                              target.write_bytes(content)
                              print('RECOVERED: exact original photo; bytes=497941; sha256=' + expected)
                              return True
                  if depth < 2:
                      for item in z.infolist():
                          if item.filename.lower().endswith('.zip') and item.file_size < 150000000 and examined[0] < 40:
                              examined[0] += 1
                              try:
                                  if scan(z.read(item), depth + 1): return True
                              except (zipfile.BadZipFile, RuntimeError): pass
              return False
          sources = ['https://raw.githubusercontent.com/softm/hwagok-farm/main/backup.zip']
          found = False
          for url in sources:
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'farm-approved-archive-recovery'})
                  with urllib.request.urlopen(request, timeout=180) as response:
                      data = response.read(160000001)
                  if len(data) > 160000000: raise ValueError('Recovery source exceeds 160 MB safety limit')
                  if scan(data):
                      found = True
                      break
              except Exception as error:
                  print('Source recovery unavailable: ' + type(error).__name__ + ': ' + str(error))
          summary = 'Exact source photo recovered and verified.' if found else 'Exact source photo not found. Original upload remains required; do not report complete.'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f: f.write(summary + '\n')
          PY
      - name: Commit only the verified source photo
        run: |
          FILE='records/20261009-bak-cultivation/images/04_원본사진_박생육.jpg'
          if [ -f "$FILE" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$FILE"
            if ! git diff --cached --quiet; then
              git commit -m 'Restore original gourd photo after exact SHA-256 verification'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
