name: Herbicide original recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/recover_herbicide_originals.py
      - .github/workflows/herbicide-original-recovery.yml
permissions:
  contents: write
concurrency:
  group: herbicide-original-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact originals only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/recover_herbicide_originals.py
      - name: Preserve successful matches and factual report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- herbicide-original-recovery.json records/20261009-herbicide-classification/images
          if ! git diff --cached --quiet; then
            git commit -m 'archive: preserve verified herbicide source recovery result'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herbicide-original-recovery
          path: herbicide-original-recovery.json
          retention-days: 30
