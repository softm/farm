name: Deploy farm archive to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install archive renderer
        run: python -m pip install markdown-it-py Pillow
      - name: Verify approved sources and render every archive
        run: |
          python scripts/build_archive.py
          python scripts/build_herbicide.py
          python scripts/finalize_herbicide_build.py
      - name: Export complete herbicide source and generated archive
        uses: actions/upload-artifact@v4
        with:
          name: herbicide-archive-source
          path: |
            records/20261009-herbicide-classification/
            scripts/build_herbicide.py
            herbicide-build-verification.json
          retention-days: 30
      - name: Persist imported originals and canonical record metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- records/20261009-bak-cultivation records/20261009-sprinkler-thread-guide records/20261009-herbicide-classification archive-index.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Sync rendered farm archive content and verified sources'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Install browser verifier
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify live URLs, hashes, desktop, mobile and image dialogs
        run: |
          python scripts/verify_live.py
          if test -f scripts/verify_herbicide_live.py; then python scripts/verify_herbicide_live.py; fi
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-archive-verification
          path: |
            build-verification.json
            live-verification.json
            herbicide-build-verification.json
            herbicide-live-verification.json
            verified-*.png
          retention-days: 30
      - name: Remove only verified input ZIPs after successful live checks
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          report = json.loads(pathlib.Path('live-verification.json').read_text())
          targets = [
              ('20261009-bak-cultivation',
               pathlib.Path('zip/20261009_박_적심도식_정리_MD_HTML_전체자료.zip'),
               '5d4c12e9b4962635f395065794dfe44c9f5899a1660be30591280e6a6363d920'),
              ('20261009-sprinkler-thread-guide',
               pathlib.Path('zip/20261009_스프링클러_배관_나사_규격_정리_MD_HTML_전체자료.zip'),
               '9938ab410763d27a0aa5d40e96fda2617dc7a44a660fdde30b69937b704a710c'),
          ]
          for slug, path, digest in targets:
              ok = report['records'][slug]['sourceIntegrityComplete']
              if slug == '20261009-sprinkler-thread-guide':
                  ok = ok and report.get('sprinklerVerified') is True
              if ok and path.exists():
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
                  path.unlink()
          PY
          git add -u -- zip
          if ! git diff --cached --quiet; then
            git commit -m 'Clean verified input ZIPs; originals retained in archive'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
