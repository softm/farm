<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="농업·농사 공개 아카이브 — 재배 도식, 영농 기록과 원본 자료"><title>농업·농사 공개 아카이브</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f5f8f3;color:#24362a;line-height:1.65}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:1.7rem;margin:12px 0}a{color:#176b38;overflow-wrap:anywhere}.record{background:#fff;border:1px solid #d9e5db;padding:18px;border-radius:12px;margin:16px 0}.record h2{font-size:1.15rem}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}input,select,button{font:inherit;padding:9px;border:1px solid #bbcabb;border-radius:7px}input{flex:1;min-width:160px}.meta{font-size:.9rem;color:#425d49}.pending{color:#8b4c11}.list .record{padding:12px}.thumb{max-width:360px;width:100%;border:1px solid #dce5db}.list .thumb{display:none}#empty{display:none}</style></head><body><main><header><h1>농업·농사 <button id="copy" aria-label="프로젝트 주소 복사" title="주소 복사">⧉</button></h1><p><a href="https://softm.github.io/projects/">전체 프로젝트</a> · <a href="https://github.com/softm/farm">farm</a></p><p>재배 도식·영농 기록·농약·농기계 자료를 기록별로 보관합니다.</p></header><div class="tools"><input id="q" type="search" placeholder="기록 검색" aria-label="기록 검색"><select id="sort" aria-label="정렬"><option value="new">최신순</option><option value="old">오래된순</option><option value="title">제목순</option></select><button id="view">간단히 보기</button></div><p id="count" class="meta">공개 기록 1개</p><div id="records"><article class="record"><a href="records/20261009-bak-cultivation/"><img class="thumb" src="records/20261009-bak-cultivation/images/00_적심핵심도식.svg" alt="박 적심 핵심 도식"></a><h2><a href="records/20261009-bak-cultivation/">20261009_박_적심도식_정리_MD_HTML_전체자료.zip</a></h2><p>박 적심 도식화 정리 · 적심 전 → 절단 위치 → 적심 후 아들줄기</p><p class="meta">2026-10-09 정리 · 재배 · 도식 4개</p><p id="source-status" class="meta"></p><p><a href="records/20261009-bak-cultivation/">기록 열기</a> · <a href="https://github.com/softm/farm/tree/main/records/20261009-bak-cultivation">20261009-bak-cultivation</a></p></article></div><p id="empty">검색 결과가 없습니다.</p><p id="message" role="status"></p></main><script>const q=document.getElementById('q'),cards=[...document.querySelectorAll('.record')];q.addEventListener('input',()=>{let n=0;cards.forEach(x=>{x.hidden=!x.textContent.toLowerCase().includes(q.value.toLowerCase());if(!x.hidden)n++});document.getElementById('count').textContent='공개 기록 '+n+'개';document.getElementById('empty').style.display=n?'none':'block'});document.getElementById('view').onclick=()=>document.getElementById('records').classList.toggle('list');document.getElementById('sort').onchange=()=>{cards.sort((a,b)=>document.getElementById('sort').value==='title'?a.textContent.localeCompare(b.textContent):0).forEach(x=>document.getElementById('records').append(x))};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText('https://softm.github.io/farm/');document.getElementById('message').textContent='주소를 복사했습니다.'}catch{document.getElementById('message').textContent='https://softm.github.io/farm/'}};fetch('archive-index.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{let x=d.records.find(x=>x.id==='20261009-bak-cultivation'),e=document.getElementById('source-status');e.textContent=x.sourceIntegrityComplete?'원본 사진 1장 · 원본 파일 해시 확인':'원본 사진 업로드 대기 · 320px 미리보기 제공';e.classList.toggle('pending',!x.sourceIntegrityComplete)}).catch(()=>document.getElementById('source-status').textContent='파일 상태는 상세 기록의 파일·검증에서 확인하세요.');</script></body></html>
