<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="농업·농사 공개 아카이브 — 재배·관수·영농 기록과 원본 자료"><title>농업·농사 공개 아카이브</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;margin:0;background:#f5f8f3;color:#24362a;line-height:1.65}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:1.7rem;margin:12px 0}a{color:#176b38;overflow-wrap:anywhere}.record{background:#fff;border:1px solid #d9e5db;padding:18px;border-radius:12px;margin:16px 0}.record h2{font-size:1.15rem;margin:.5rem 0}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}input,select,button{font:inherit;padding:9px;border:1px solid #bbcabb;border-radius:7px;background:#fff}input{flex:1;min-width:160px}.meta{font-size:.9rem;color:#425d49}.pending{color:#8b4c11}.ok{color:#176b38}.list .record{padding:12px}.thumb{max-width:360px;width:100%;border:1px solid #dce5db;border-radius:8px}.list .thumb{display:none}#empty{display:none}.status{font-weight:700}.skeleton{opacity:.7}</style></head><body><main><header><h1>농업·농사 <button id="copy" aria-label="프로젝트 주소 복사" title="주소 복사">⧉</button></h1><p><a href="https://softm.github.io/projects/">전체 프로젝트</a> · <a href="https://github.com/softm/farm">farm</a></p><p>재배·관수·영농 기록을 기록별로 보관합니다. 공개 기록의 원본 확보 상태도 함께 표시합니다.</p></header>
<div class="tools"><input id="q" type="search" placeholder="기록 검색" aria-label="기록 검색"><select id="sort" aria-label="정렬"><option value="new">최신순</option><option value="old">오래된순</option><option value="title">제목순</option></select><button id="view">간단히 보기</button></div><p id="count" class="meta">목록을 읽는 중입니다.</p><div id="records"><article class="record skeleton">공개 기록을 불러오는 중입니다.</article></div><p id="empty">검색 결과가 없습니다.</p><p id="message" role="status"></p></main>
<script>
const $=s=>document.querySelector(s),recordsEl=$('#records'),countEl=$('#count'),q=$('#q'),sort=$('#sort'),empty=$('#empty');
let data=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function statusText(r){if(r.sourceIntegrityComplete)return '<span class="status ok">원본 확인 완료</span>';const n=(r.missingFiles||[]).length;return '<span class="status pending">원본 '+(n?n+'개 ':'')+'업로드/확인 대기</span>'}
function thumb(r){if(r.id==='20261009-bak-cultivation')return '<a href="'+esc(r.url)+'"><img class="thumb" src="records/20261009-bak-cultivation/images/00_적심핵심도식.svg" alt="박 적심 핵심 도식"></a>';return ''}
function render(){
 const term=q.value.trim().toLowerCase();let rows=data.filter(r=>[r.title,r.sourceTitle,r.description,r.kind].join(' ').toLowerCase().includes(term));
 if(sort.value==='new')rows.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(a.title||'').localeCompare(b.title||''));
 if(sort.value==='old')rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.title||'').localeCompare(b.title||''));
 if(sort.value==='title')rows.sort((a,b)=>(a.title||'').localeCompare(b.title||''));
 countEl.textContent='공개 기록 '+rows.length+'개';empty.style.display=rows.length?'none':'block';
 recordsEl.innerHTML=rows.map(r=>'<article class="record">'+thumb(r)+'<h2><a href="'+esc(r.url)+'">'+esc(r.listTitle||r.title)+'</a></h2><p>'+esc(r.sourceTitle||r.description||'')+'</p><p>'+esc(r.description||'')+'</p><p class="meta">'+esc(r.date||'날짜 미확인')+' · '+esc(r.kind||'기록')+' · '+statusText(r)+'</p><p><a href="'+esc(r.url)+'">기록 열기</a> · <a href="'+esc(r.repoUrl)+'">'+esc(r.slug||r.id)+'</a></p></article>').join('');
}
fetch('archive-index.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('index');return r.json()}).then(j=>{data=(j.records||[]).filter(r=>r.visibility==='public');render()}).catch(()=>{recordsEl.innerHTML='<article class="record pending">목록을 불러오지 못했습니다. GitHub 저장소에서 기록을 확인하세요.</article>';countEl.textContent='목록 동기화 실패'});
q.addEventListener('input',render);sort.addEventListener('change',render);$('#view').onclick=()=>recordsEl.classList.toggle('list');$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText('https://softm.github.io/farm/');$('#message').textContent='주소를 복사했습니다.'}catch{$('#message').textContent='https://softm.github.io/farm/'}}</script></body></html>
